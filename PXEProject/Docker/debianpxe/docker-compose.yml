services:
  dnsmasq:
    build:
      dockerfile: Dockerfile.dnsmasq
    container_name: svendnsmasq
    entrypoint: dnsmasq -d
    restart: unless-stopped
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./tftpboot:/var/tftpboot
    ports:
      - "69:69/udp"
      - "67:67/udp"
  nginx:
    build:
      dockerfile: Dockerfile.nginx
    container_name: svennginx
    entrypoint: nginx -g "daemon off;"
    ports:
      - 8080:8080
    restart: unless-stopped
    volumes:
      - ./tftpboot:/var/tftpboot
    network_mode: "host"