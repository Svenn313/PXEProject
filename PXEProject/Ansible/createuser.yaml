- name: Create User
  hosts: PXEAutomation
  become: yes
  become_user: root
  become_method: su

  - name: Create Users & Groups
  hosts: target1
  gather_facts: false
  vars_files: userlist
  tasks:
    - name: Create groups
      group:
        name: "{{ admin_group }}"
        state: present

    - name: Create Users Task
      user:
        name: "{{ item }}"
        state: present
        password: "{{ default_user_password | password_hash('sha512','A512') }}"
        shell: /bin/bash
        group: "{{ admin_group }}"